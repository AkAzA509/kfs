name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GCC 15
        run: |
             sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
             sudo apt update
             sudo apt install -y gcc-15 g++-15 gcc-15-multilib g++-15-multilib
             sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
             sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100

      - name: Install kernel test dependencies
        run: sudo apt install -y clang lld nasm grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Run libc tests
        run: make test-libc

      - name: Run kernel tests
        run: make KERNEL_CC=clang test-kernel
